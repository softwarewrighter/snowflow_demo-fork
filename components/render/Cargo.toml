[workspace]
resolver = "3"
members = ["crates/xetal-world-render", "crates/xetal-world-shadow"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/snowflow_demo-fork"

[workspace.dependencies]
xetal-world-surface = { path = "../surface/crates/xetal-world-surface" }
wgpu = { version = "=24.0.5", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
bytemuck = "1.25"
naga = { version = "=24.0.0", features = ["wgsl-in"] }
