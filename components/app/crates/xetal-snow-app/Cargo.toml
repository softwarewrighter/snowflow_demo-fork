[package]
name = "xetal-snow-app"
description = "Browser application composition and inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xetal-snow-layer = { path = "../../../snow/crates/xetal-snow-layer" }
xetal-app-session = { path = "../../../session/crates/xetal-app-session" }
xetal-app-tiles = { path = "../../../session/crates/xetal-app-tiles" }
xetal-snow-libraries = { path = "../../../world/crates/xetal-snow-libraries" }
xetal-world-metrics = { path = "../xetal-world-metrics" }
xetal-world-surface = { path = "../../../surface/crates/xetal-world-surface" }
xetal-world-trail = { path = "../xetal-world-trail" }
xetal-world-navigation = { path = "../xetal-world-navigation" }
xetal-world-model.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
xetal-world-audio = { path = "../xetal-world-audio" }
xetal-world-render.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true
