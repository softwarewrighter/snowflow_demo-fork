[package]
name = "xetal-snow-app"
description = "Browser application composition and inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xetal-world-ribbon = { path = "../../../effects/crates/xetal-world-ribbon" }
xetal-world-bloom = { path = "../../../effects/crates/xetal-world-bloom" }
xetal-world-sweep = { path = "../../../world/crates/xetal-world-sweep" }
xetal-world-spells = { path = "../../../world/crates/xetal-world-spells" }
xetal-world-metrics = { path = "../xetal-world-metrics" }
xetal-world-surface = { path = "../../../surface/crates/xetal-world-surface" }
xetal-world-stream = { path = "../../../world/crates/xetal-world-stream" }
xetal-world-trail = { path = "../xetal-world-trail" }
xetal-world-navigation = { path = "../xetal-world-navigation" }
xetal-world-model.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
xetal-world-audio = { path = "../xetal-world-audio" }
xetal-world-render.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true
